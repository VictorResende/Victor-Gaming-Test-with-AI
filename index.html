<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0806" />
  <title>Reino dos Guardiões - Defesa Arcana (Tower Defense 2D)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #12141c 0%, #07080f 70%, #050508 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      cursor: default;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    canvas {
      display: block;
      margin: auto;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(217, 119, 6, 0.25);
      border-radius: 4px;
      cursor: default;
    }

    /* Tooltip de atalhos web no desktop */
    #web-helper {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 11px;
      color: #71717a;
      pointer-events: none;
      z-index: 100;
      letter-spacing: 0.4px;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="web-helper">Atalhos: [1-6] Torres | [Q,W,E] Feitiços | [Z,X] Herói | [Espaço] Onda | [F] Tela Cheia | [P] Pausa</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
